<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🏠 家庭点菜</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(160deg, #fff8f0 0%, #ffedd8 100%);
  min-height: 100vh; color:#5a4632;
}
/* ── 头部 ── */
.header {
  background: linear-gradient(135deg, #ff8c42, #ff6b6b);
  color:#fff; padding:20px 20px 24px; border-radius:0 0 28px 28px;
  box-shadow: 0 4px 20px rgba(255,107,107,.35);
  position: relative;
}
.header h1 { font-size:24px; font-weight:800; display:flex; align-items:center; gap:8px; }
.header .sub { font-size:13px; opacity:.9; margin-top:4px; }
.header .badge {
  position:absolute; right:16px; top:16px; background:rgba(255,255,255,.25);
  padding:6px 12px; border-radius:20px; font-size:13px; font-weight:600;
}
/* ── 页面容器 ── */
.page { display:none; padding:16px 16px 90px; animation: fadeIn .25s ease; }
.page.active { display:block; }
@keyframes fadeIn { from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none} }

/* ── 人数选择 ── */
.section-title { font-size:15px; font-weight:700; margin:18px 0 12px; display:flex; align-items:center; gap:6px; }
.section-title .bar { width:4px; height:16px; border-radius:2px; background:#ff8c42; display:inline-block; }
.people-grid { display:flex; gap:10px; flex-wrap:wrap; }
.people-btn {
  flex:1; min-width:64px; height:64px; border-radius:16px; background:#fff;
  border:2px solid #f0dcc8; display:flex; flex-direction:column; align-items:center;
  justify-content:center; cursor:pointer; transition:all .15s; font-size:12px; color:#9a7b5f;
}
.people-btn .num { font-size:22px; font-weight:800; color:#5a4632; }
.people-btn.selected {
  border-color:#ff8c42; background:linear-gradient(135deg,#ff8c42,#ff6b6b); color:#fff;
  box-shadow:0 4px 14px rgba(255,107,107,.4); transform:scale(1.05);
}
.people-btn.selected .num { color:#fff; }

/* ── 分类 Tabs ── */
.tabs { display:flex; gap:8px; overflow-x:auto; padding:4px 0 12px; scrollbar-width:none; }
.tabs::-webkit-scrollbar { display:none; }
.tab {
  flex-shrink:0; padding:8px 16px; border-radius:20px; background:#fff;
  border:1.5px solid #f0dcc8; font-size:13px; font-weight:600; color:#9a7b5f;
  cursor:pointer; transition:all .15s;
}
.tab.active { background:#ff8c42; border-color:#ff8c42; color:#fff; box-shadow:0 3px 10px rgba(255,140,66,.3); }

/* ── 菜品网格 ── */
.dish-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.dish {
  background:#fff; border-radius:16px; padding:12px 8px; text-align:center;
  border:2px solid transparent; cursor:pointer; transition:all .15s;
  box-shadow:0 2px 8px rgba(90,70,50,.06); position:relative;
}
.dish:active { transform:scale(.96); }
.dish .emoji { font-size:32px; display:block; margin-bottom:6px; }
.dish .dish-photo { display:block; width:52px; height:52px; margin:0 auto 6px; border-radius:12px; overflow:hidden; background:#f5e8d8; }
.dish .dish-photo img { width:100%; height:100%; object-fit:cover; display:block; }
.dish .name { font-size:13px; font-weight:600; color:#5a4632; line-height:1.3; }
.dish .tag { font-size:10px; color:#c4a98e; margin-top:3px; display:block; }
.dish .eaten-tag { position:absolute; bottom:6px; left:6px; font-size:9px; color:#9a7b5f; background:#f5e8d8; padding:1px 5px; border-radius:8px; }
.dish.selected {
  border-color:#ff6b6b; background:linear-gradient(160deg,#fff,#fff5f0);
  box-shadow:0 4px 14px rgba(255,107,107,.25);
}
.dish.selected::after {
  content:"✓"; position:absolute; top:6px; right:8px; width:20px; height:20px;
  background:#ff6b6b; color:#fff; border-radius:50%; font-size:12px; font-weight:700;
  display:flex; align-items:center; justify-content:center;
}
.dish .count-badge {
  position:absolute; bottom:6px; right:6px; background:#ff8c42; color:#fff;
  font-size:11px; font-weight:700; border-radius:10px; padding:1px 6px; display:none;
}
.dish.selected .count-badge { display:block; }

/* ── 底部操作栏 ── */
.bottom-bar {
  position:fixed; bottom:0; left:0; right:0; background:rgba(255,255,255,.95);
  backdrop-filter: blur(10px); padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  display:flex; align-items:center; gap:12px; box-shadow:0 -4px 20px rgba(90,70,50,.08);
  border-top:1px solid #f0e4d4; z-index:50;
}
.bar-info { flex:1; font-size:13px; color:#9a7b5f; line-height:1.4; }
.bar-info b { color:#5a4632; font-size:15px; }
.btn {
  border:none; border-radius:14px; padding:12px 22px; font-size:15px; font-weight:700;
  cursor:pointer; transition:all .15s; font-family:inherit;
}
.btn-primary { background:linear-gradient(135deg,#ff8c42,#ff6b6b); color:#fff; box-shadow:0 4px 14px rgba(255,107,107,.35); }
.btn-primary:active { transform:scale(.95); }
.btn-ghost { background:#f5e8d8; color:#9a7b5f; }
.btn:disabled { opacity:.4; }

/* ── 清单页 ── */
.list-group { background:#fff; border-radius:18px; padding:14px; margin-bottom:12px; box-shadow:0 2px 8px rgba(90,70,50,.05); }
.list-group h3 { font-size:14px; font-weight:700; margin-bottom:10px; display:flex; justify-content:space-between; color:#5a4632; }
.list-item { display:flex; align-items:center; padding:8px 0; border-bottom:1px dashed #f0e4d4; }
.list-item:last-child { border-bottom:none; }
.list-item .emoji { font-size:22px; margin-right:10px; }
.list-item .name { flex:1; font-size:14px; font-weight:600; }
.list-item .ctrl { display:flex; align-items:center; gap:10px; }
.list-item .ctrl button {
  width:28px; height:28px; border-radius:50%; border:1.5px solid #ff8c42; background:#fff;
  color:#ff8c42; font-size:16px; font-weight:700; cursor:pointer; line-height:1;
}
.list-item .ctrl button:active { background:#fff0e6; }
.list-item .ctrl .qty { font-size:15px; font-weight:700; min-width:16px; text-align:center; }
.summary-card {
  background:linear-gradient(135deg,#ff8c42,#ff6b6b); border-radius:18px; padding:16px;
  color:#fff; margin-bottom:14px; box-shadow:0 4px 14px rgba(255,107,107,.3);
}
.summary-card .row { display:flex; justify-content:space-between; font-size:14px; margin:6px 0; }
.summary-card .row b { font-size:16px; }

/* ── 结果页 ── */
.result-card {
  background:#fff; border-radius:20px; padding:24px 20px; text-align:center;
  box-shadow:0 4px 20px rgba(90,70,50,.08); margin-top:10px;
}
.result-card .big-emoji { font-size:56px; }
.result-card h2 { font-size:20px; margin:10px 0 4px; color:#5a4632; }
.result-card .meta { color:#9a7b5f; font-size:13px; margin-bottom:16px; }
.result-list { text-align:left; margin:14px 0; }
.result-item { display:flex; justify-content:space-between; padding:8px 4px; border-bottom:1px dashed #f0e4d4; font-size:14px; }
.result-item:last-child { border:none; }
.result-item .tag { font-size:11px; padding:2px 8px; border-radius:10px; margin-left:6px; }
.tag-meat { background:#ffe3e3; color:#e05555; }
.tag-veg { background:#e4f7e4; color:#3aa03a; }
.tag-other { background:#fff0e0; color:#d9822b; }
.btn-row { display:flex; gap:10px; margin-top:18px; }
.btn-row .btn { flex:1; }

/* ── 自定义菜单页 ── */
.form-card { background:#fff; border-radius:18px; padding:16px; margin-bottom:12px; box-shadow:0 2px 8px rgba(90,70,50,.05); }
.form-card label { font-size:13px; font-weight:600; color:#9a7b5f; display:block; margin:10px 0 6px; }
.form-card input, .form-card select {
  width:100%; padding:12px; border:1.5px solid #f0dcc8; border-radius:12px;
  font-size:14px; font-family:inherit; background:#fdf9f4; color:#5a4632; outline:none;
}
.form-card input:focus { border-color:#ff8c42; }
.added-item { display:flex; align-items:center; padding:10px 0; border-bottom:1px dashed #f0e4d4; }
.added-item:last-child { border:none; }
.added-item .mgr-photo { width:38px; height:38px; border-radius:10px; overflow:hidden; background:#f5e8d8; display:flex; align-items:center; justify-content:center; font-size:20px; margin-right:10px; flex-shrink:0; }
.added-item .mgr-photo img { width:100%; height:100%; object-fit:cover; display:block; }
.added-item .name { flex:1; font-size:14px; }
.added-item .cat { font-size:11px; color:#9a7b5f; background:#f5e8d8; padding:2px 8px; border-radius:10px; }
.added-item .del { color:#e05555; font-size:18px; padding:0 6px; cursor:pointer; }
.history-card { background:#fff; border-radius:18px; padding:14px; margin-bottom:12px; box-shadow:0 2px 8px rgba(90,70,50,.05); }
.history-head { display:flex; justify-content:space-between; font-size:13px; color:#9a7b5f; margin-bottom:8px; }
.history-meta { font-size:11px; background:#f5e8d8; padding:2px 8px; border-radius:10px; }
.history-dishes { font-size:14px; color:#5a4632; line-height:1.6; margin-bottom:10px; }
.history-actions { text-align:right; }

/* ── Toast ── */
.toast {
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) scale(.9);
  background:rgba(40,30,20,.9); color:#fff; padding:14px 24px; border-radius:14px;
  font-size:14px; z-index:99; opacity:0; transition:all .2s; pointer-events:none;
  text-align:center; max-width:70%;
}
.toast.show { opacity:1; transform:translate(-50%,-50%) scale(1); }
</style>
</head>
<body>

<!-- ═══════════ 页面1: 人数选择 ═══════════ -->
<div class="header">
  <h1>🏠 家庭点菜</h1>
  <div class="sub">今天想好好吃一顿～</div>
  <div class="badge" id="headerBadge">👥 选人数</div>
</div>

<div class="page active" id="page-people">
  <div class="section-title"><span class="bar"></span>几个人用餐？</div>
  <div class="people-grid" id="peopleGrid"></div>

  <div class="section-title"><span class="bar"></span>谁在点菜？</div>
  <div class="people-grid" id="whoGrid">
    <div class="people-btn" data-who="我">
      <span class="emoji" style="font-size:26px">😎</span><span>我</span>
    </div>
    <div class="people-btn" data-who="我们">
      <span class="emoji" style="font-size:26px">💑</span><span>我们俩</span>
    </div>
    <div class="people-btn" data-who="老婆">
      <span class="emoji" style="font-size:26px">👩</span><span>老婆点</span>
    </div>
  </div>

  <div class="section-title"><span class="bar"></span>🎲 选择困难？</div>
  <div style="display:flex; gap:10px">
    <button class="btn btn-ghost" style="flex:1" onclick="randomMeal()">🎲 今天吃什么</button>
    <button class="btn btn-ghost" style="flex:1" onclick="goPage('page-history')">🕘 点菜历史</button>
  </div>

  <div class="section-title"><span class="bar"></span>📝 自定义菜单</div>
  <div style="display:flex; gap:10px">
    <button class="btn btn-ghost" style="flex:1" onclick="goPage('page-manage')">✏️ 管理菜单</button>
    <button class="btn btn-ghost" style="flex:1" onclick="resetAll()">🔄 清空重来</button>
  </div>

  <div class="section-title"><span class="bar"></span>🔔 推送通知</div>
  <div style="display:flex; gap:10px">
    <button class="btn btn-ghost" style="flex:1" onclick="openPushSettings()">⚙️ 设置推送</button>
    <button class="btn btn-ghost" style="flex:1" onclick="testBark()">📲 测试推送</button>
  </div>

  <div style="height:24px"></div>
  <div class="bottom-bar">
    <div class="bar-info">选好人数和谁点菜<br>开始愉快的点菜吧</div>
    <button class="btn btn-primary" onclick="startOrder()">开始点菜 🍽️</button>
  </div>
</div>

<!-- ═══════════ 页面2: 点菜 ═══════════ -->
<div class="page" id="page-order">
  <div class="section-title" style="margin-top:8px"><span class="bar"></span><span id="orderTitle">👥 3人用餐</span></div>
  <div class="tabs" id="catTabs"></div>
  <div class="dish-grid" id="dishGrid"></div>

  <div class="bottom-bar">
    <div class="bar-info" id="barInfo"><b>0</b> 道菜 · 荤 <b>0</b> / 素 <b>0</b></div>
    <button class="btn btn-ghost" onclick="goPage('page-people')">← 返回</button>
    <button class="btn btn-primary" id="btnViewList" onclick="goPage('page-list')" disabled>看清单 📋</button>
  </div>
</div>

<!-- ═══════════ 页面3: 清单 ═══════════ -->
<div class="page" id="page-list">
  <div class="section-title" style="margin-top:8px"><span class="bar"></span>已点清单</div>
  <div class="summary-card">
    <div class="row"><span>👥 用餐人数</span><b id="sumPeople">3 人</b></div>
    <div class="row"><span>🍖 荤菜</span><b id="sumMeat">0 道</b></div>
    <div class="row"><span>🥬 素菜</span><b id="sumVeg">0 道</b></div>
    <div class="row"><span>🍲 其他</span><b id="sumOther">0 道</b></div>
    <div class="row"><span>📦 合计</span><b id="sumTotal">0 道</b></div>
  </div>
  <div id="listGroups"></div>
  <div class="bottom-bar">
    <div class="bar-info" id="barInfo2"></div>
    <button class="btn btn-ghost" onclick="goPage('page-order')">← 继续点</button>
    <button class="btn btn-primary" onclick="finishOrder()">点好了 ✅</button>
  </div>
</div>

<!-- ═══════════ 页面4: 结果 ═══════════ -->
<div class="page" id="page-result">
  <div class="result-card">
    <div class="big-emoji">🍽️</div>
    <h2>点菜完成！</h2>
    <div class="meta" id="resultMeta"></div>
    <div class="result-list" id="resultList"></div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="copyResult()">📋 复制</button>
      <button class="btn btn-primary" onclick="copyShopping()">🛒 购物清单</button>
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" style="flex:1" onclick="window.print()">🖨️ 截图/打印</button>
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" style="flex:1" onclick="goPage('page-people')">🏠 回到首页</button>
    </div>
  </div>
</div>

<!-- ═══════════ 页面5: 菜单管理 ═══════════ -->
<div class="page" id="page-manage">
  <div class="section-title" style="margin-top:8px"><span class="bar"></span>➕ 添加新菜</div>
  <div class="form-card">
    <label>菜名</label>
    <input id="inpName" placeholder="比如：红烧排骨">
    <label>分类</label>
    <select id="inpCat">
      <option value="meat">🍖 荤菜</option>
      <option value="veg">🥬 素菜</option>
      <option value="soup">🍲 汤</option>
      <option value="cold">🥗 凉菜</option>
      <option value="staple">🍚 主食</option>
      <option value="drink">🥤 饮品</option>
    </select>
    <label>图标 (emoji)</label>
    <input id="inpEmoji" placeholder="🍖" maxlength="4">
    <div style="margin-top:12px"><button class="btn btn-primary" style="width:100%" onclick="addDish()">添加 ➕</button></div>
  </div>
  <div class="section-title"><span class="bar"></span>📋 全部菜单（点 📷 可设置照片）</div>
  <div class="form-card" id="customList"></div>
  <div class="bottom-bar">
    <button class="btn btn-ghost" style="flex:1" onclick="goPage('page-people')">← 返回</button>
  </div>
</div>

<!-- ═══════════ 页面6: 历史记录 ═══════════ -->
<div class="page" id="page-history">
  <div class="section-title" style="margin-top:8px"><span class="bar"></span>🕘 最近点过的菜</div>
  <div id="historyList"></div>
  <div class="bottom-bar">
    <button class="btn btn-ghost" style="flex:1" onclick="goPage('page-people')">← 返回</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 隐藏的照片选择 input（移动端兼容） -->
<input type="file" id="photoInput" accept="image/*" style="display:none">

<!-- ═══════════ 推送设置弹窗 ═══════════ -->
<div class="modal-mask" id="pushModal" style="display:none" onclick="if(event.target===this)closePushSettings()">
  <div class="modal">
    <h3 style="margin-bottom:10px">🔔 推送设置</h3>
    <label style="font-size:13px;color:#9a7b5f;display:block;margin-bottom:6px">Bark 设备 Key</label>
    <input id="inpBarkKey" placeholder="粘贴 Bark 的 Key" style="width:100%;padding:12px;border:1.5px solid #f0dcc8;border-radius:12px;font-size:14px;background:#fdf9f4;color:#5a4632;outline:none;box-sizing:border-box">
    <p style="font-size:11px;color:#c4a98e;margin:8px 0 14px">在 iPhone 的 Bark App 里查看设备 Key，形如 xxxxxxxx-xxxx</p>
    <div style="display:flex;gap:10px">
      <button class="btn btn-ghost" style="flex:1" onclick="closePushSettings()">取消</button>
      <button class="btn btn-primary" style="flex:1" onclick="savePushKey()">保存 💾</button>
    </div>
  </div>
</div>

<style>
.modal-mask { position:fixed; inset:0; background:rgba(40,30,20,.45); z-index:80; display:flex; align-items:center; justify-content:center; padding:20px; }
.modal { background:#fff; border-radius:20px; padding:22px; width:100%; max-width:340px; box-shadow:0 8px 30px rgba(0,0,0,.2); }
</style>

<script>
// ═════════════ 数据 ═════════════
const CATS = {
  meat:   { name: '🍖 荤菜', tag: '荤', tagClass: 'tag-meat' },
  veg:    { name: '🥬 素菜', tag: '素', tagClass: 'tag-veg' },
  soup:   { name: '🍲 汤',   tag: '汤', tagClass: 'tag-other' },
  cold:   { name: '🥗 凉菜', tag: '凉', tagClass: 'tag-other' },
  staple: { name: '🍚 主食', tag: '主', tagClass: 'tag-other' },
  drink:  { name: '🥤 饮品', tag: '饮', tagClass: 'tag-other' },
};

const DEFAULT_MENU = [
  // 荤菜
  ['红烧排骨', 'meat', '🍖'], ['可乐鸡翅', 'meat', '🍗'], ['糖醋里脊', 'meat', '🥩'],
  ['宫保鸡丁', 'meat', '🍛'], ['红烧肉', 'meat', '🍖'], ['清蒸鲈鱼', 'meat', '🐟'],
  ['回锅肉', 'meat', '🥘'], ['蒜蓉大虾', 'meat', '🦐'],
  // 素菜
  ['清炒时蔬', 'veg', '🥬'], ['西红柿炒蛋', 'veg', '🍅'], ['地三鲜', 'veg', '🍆'],
  ['蒜蓉西兰花', 'veg', '🥦'], ['酸辣土豆丝', 'veg', '🥔'], ['麻婆豆腐', 'veg', '🌶️'],
  // 汤
  ['紫菜蛋花汤', 'soup', '🍲'], ['玉米排骨汤', 'soup', '🌽'], ['番茄牛腩汤', 'soup', '🍅'],
  // 凉菜
  ['拍黄瓜', 'cold', '🥒'], ['凉拌木耳', 'cold', '🍄'], ['皮蛋豆腐', 'cold', '🥚'],
  // 主食
  ['白米饭', 'staple', '🍚'], ['蛋炒饭', 'staple', '🍳'], ['馒头', 'staple', '🥟'],
  // 饮品
  ['可乐', 'drink', '🥤'], ['橙汁', 'drink', '🧃'], ['酸奶', 'drink', '🥛'],
];

let state = {
  people: 0,
  who: '我',
  orders: {},   // { dishName: qty }
  activeCat: 'meat',
  customMenu: [],
};

// ═════════════ Bark 推送配置 ═════════════
const BARK_DEFAULT_KEY = 'WdULJpKDLtGsxWM3uMe9pR';
const BARK_API = 'https://api.day.app';

function getBarkKey() {
  return localStorage.getItem('barkKey') || BARK_DEFAULT_KEY;
}

function sendBark(title, body) {
  const key = getBarkKey();
  if (!key) return;
  const url = `${BARK_API}/${key}/${encodeURIComponent(title)}/${encodeURIComponent(body)}`;
  fetch(url, { mode: 'no-cors' }).catch(() => {});
}

function testBark() {
  const key = getBarkKey();
  if (!key) { toast('先设置推送 Key 哦'); return; }

// ═════════════ 菜品照片 (IndexedDB) ═════════════
function openPhotoDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('familyMenuDB', 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('dishPhotos')) {
        db.createObjectStore('dishPhotos');
      }
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = e => reject(e);
  });
}

async function saveDishPhoto(name, dataUrl) {
  try {
    const db = await openPhotoDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('dishPhotos', 'readwrite');
      tx.objectStore('dishPhotos').put(dataUrl, name);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
  } catch (e) { return false; }
}

async function getDishPhoto(name) {
  try {
    const db = await openPhotoDB();
    return new Promise(resolve => {
      const tx = db.transaction('dishPhotos', 'readonly');
      const req = tx.objectStore('dishPhotos').get(name);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => resolve(null);
    });
  } catch (e) { return null; }
}

async function removeDishPhoto(name) {
  try {
    const db = await openPhotoDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('dishPhotos', 'readwrite');
      tx.objectStore('dishPhotos').delete(name);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
  } catch (e) { return false; }
}

function compressImage(file, maxSize = 160) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(img.width * scale));
      canvas.height = Math.max(1, Math.round(img.height * scale));
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = e => { URL.revokeObjectURL(url); reject(e); };
    img.src = url;
  });
}

function pickPhoto(onDone) {
  const input = $('photoInput');
  input.value = '';
  input.onchange = async () => {
    const file = input.files && input.files[0];
    if (!file) return;
    try {
      const dataUrl = await compressImage(file);
      onDone(dataUrl);
    } catch (e) {
      toast('❌ 图片处理失败', 2000);
    }
  };
  input.click();
}

function saveHistory(orders, people, who) {
  const hist = getHistory();

  localStorage.setItem('dineHistory', JSON.stringify(hist));
}

// 菜品最近一次被点的时间戳（毫秒）
function lastEatenAt(name) {
  const hist = getHistory();
  for (const h of hist) {
    if (h.orders && h.orders[name]) return h.time;
  }
  return 0;
}

function timeAgo(ts) {
  const days = Math.floor((Date.now() - ts) / 86400000);
  if (days <= 0) return '今天';
  if (days === 1) return '昨天';
  if (days < 7) return `${days}天前`;
  const weeks = Math.floor(days / 7);
  return weeks === 1 ? '上周' : `${weeks}周前`;
}

};

function genShoppingList() {
  const menu = getMenu();
  const items = new Map(); // 食材 → 计数
  for (const [name, q] of Object.entries(state.orders)) {
    const recipe = INGREDIENTS[name];
    if (recipe) {
      recipe.split('、').forEach(ing => {
        const key = ing.trim();
        if (!key) return;
        items.set(key, (items.get(key) || 0) + q);
      });
    } else {
      const item = menu.find(m => m[0] === name);
      items.set(`${item ? item[2] + ' ' : ''}${name}`, (items.get(`${item ? item[2] + ' ' : ''}${name}`) || 0) + q);
    }
  }
  const lines = Array.from(items.entries())
    .map(([ing, q]) => `🛒 ${ing} ×${q}`)
    .join('\n');
  return `🧺 今日购物清单\n\n${lines}\n\n共 ${items.size} 种食材`;
}

// ═════════════ 随机搭配 ═════════════
function randomMeal() {
  const menu = getMenu();
  const byCat = {};
  menu.forEach(([name, cat]) => {
    (byCat[cat] = byCat[cat] || []).push(name);
  });
  const pick = (arr, n) => {
    const copy = [...arr];
    const out = [];
    while (out.length < n && copy.length) {
      out.push(copy.splice(Math.floor(Math.random() * copy.length), 1)[0]);
    }
    return out;
  };
  // 按人数定搭配：荤≈ceil(n/2)，素≈n，汤1，其他随机1-2
  const n = state.people || 2;
  const meatN = Math.max(1, Math.ceil(n / 2));
  const vegN = Math.max(1, n);
  const meal = [
    ...pick(byCat.meat || [], meatN),
    ...pick(byCat.veg || [], vegN),
    ...pick(byCat.soup || [], 1),
  ];
  // 主食 + 饮品随机
  const extra = pick([...(byCat.staple || []), ...(byCat.cold || []), ...(byCat.drink || [])], 2);
  meal.push(...extra);

  state.orders = {};
  meal.forEach(name => { state.orders[name] = 1; });
  toast('🎲 今天吃这些！', 1500);
  renderTabs();
  goPage('page-order');
}

async function renderDishes() {
  const grid = $('dishGrid');
  grid.innerHTML = '';
  const menu = getMenu();
  const catDishes = menu.filter(m => m[1] === state.activeCat);
  for (const [name, cat, emoji] of catDishes) {
    const qty = state.orders[name] || 0;
    const d = document.createElement('div');
    d.className = 'dish' + (qty > 0 ? ' selected' : '');
    const photo = await getDishPhoto(name);
    const lastTs = lastEatenAt(name);
    const eatenTag = lastTs ? `<span class="eaten-tag">🕘${timeAgo(lastTs)}</span>` : '';
    if (photo) {
      d.innerHTML = `
        <span class="dish-photo"><img src="${photo}" alt="${name}"></span>
        <span class="name">${name}</span>
        <span class="tag">${CATS[cat].name}</span>
        ${eatenTag}
        ${qty > 0 ? `<span class="count-badge">×${qty}</span>` : ''}`;
    } else {
      d.innerHTML = `
        <span class="emoji">${emoji}</span>
        <span class="name">${name}</span>
        <span class="tag">${CATS[cat].name}</span>
        ${eatenTag}
        ${qty > 0 ? `<span class="count-badge">×${qty}</span>` : ''}`;
    }
    d.onclick = () => toggleDish(name);
    grid.appendChild(d);
  }
  updateBar();
}

function toggleDish(name) {
  if (state.orders[name]) {
    state.orders[name]++;
  } else {
    state.orders[name] = 1;
    const menu = getMenu();
    const item = menu.find(m => m[0] === name);
    toast(item ? `${item[2]} ${name} +1` : `${name} +1`);
  }
  renderDishes();
}

function updateBar() {
  const entries = Object.entries(state.orders);
  const total = entries.reduce((s, [, q]) => s + q, 0);
  const menu = getMenu();
  let meat = 0, veg = 0;
  for (const [name, q] of entries) {
    const item = menu.find(m => m[0] === name);
    if (item && isMeatCat(item[1])) meat += q;
    else if (item) veg += q;
  }
  $('barInfo').innerHTML = `<b>${total}</b> 道菜 · 荤 <b>${meat}</b> / 素 <b>${veg}</b>`;
  $('btnViewList').disabled = total === 0;
}

// ═════════════ 清单 ═════════════
function renderList() {
  const menu = getMenu();
  const byCat = {};
  for (const [name, q] of Object.entries(state.orders)) {
    const item = menu.find(m => m[0] === name);
    const cat = item ? item[1] : 'other';
    if (!byCat[cat]) byCat[cat] = [];
    byCat[cat].push([name, q, item ? item[2] : '🍽️']);
  }
  const groups = $('listGroups');
  groups.innerHTML = '';
  let meat = 0, veg = 0, other = 0, total = 0;
  for (const [cat, items] of Object.entries(byCat)) {
    const g = document.createElement('div');
    g.className = 'list-group';
    g.innerHTML = `<h3>${CATS[cat] ? CATS[cat].name : '🍽️ 其他'} <span>${items.reduce((s, i) => s + i[1], 0)} 道</span></h3>`;
    items.forEach(([name, q, emoji]) => {
      const row = document.createElement('div');
      row.className = 'list-item';
      row.innerHTML = `
        <span class="emoji">${emoji}</span>
        <span class="name">${name}</span>
        <div class="ctrl">
          <button onclick="changeQty('${name.replace(/'/g, "\\'")}', -1)">−</button>
          <span class="qty">${q}</span>
          <button onclick="changeQty('${name.replace(/'/g, "\\'")}', 1)">+</button>
        </div>`;
      g.appendChild(row);
    });
    groups.appendChild(g);
    if (isMeatCat(cat)) meat += items.reduce((s, i) => s + i[1], 0);
    else if (cat === 'veg') veg += items.reduce((s, i) => s + i[1], 0);
    else other += items.reduce((s, i) => s + i[1], 0);
    total += items.reduce((s, i) => s + i[1], 0);
  }
  $('sumPeople').textContent = state.people + ' 人';
  $('sumMeat').textContent = meat + ' 道';
  $('sumVeg').textContent = veg + ' 道';
  $('sumOther').textContent = other + ' 道';
  $('sumTotal').textContent = total + ' 道';
  $('barInfo2').innerHTML = `共 <b>${total}</b> 道 · 荤 <b>${meat}</b> 素 <b>${veg}</b>`;
  // 搭配建议
  if (total > 0 && meat === 0) toast('再点个荤菜吧，营养均衡 🍖');
  else if (total > 0 && veg === 0) toast('加点素菜，健康美味 🥬');
}

function changeQty(name, delta) {
  state.orders[name] = (state.orders[name] || 0) + delta;
  if (state.orders[name] <= 0) delete state.orders[name];
  renderList();
  renderDishes();
}

// ═════════════ 完成 ═════════════
function finishOrder() {
  const menu = getMenu();
  const entries = Object.entries(state.orders);
  if (!entries.length) { toast('还没点菜呢 😅'); return; }
  const list = $('resultList');
  list.innerHTML = '';
  let meat = 0, veg = 0;
  for (const [name, q] of entries) {
    const item = menu.find(m => m[0] === name);
    const cat = item ? item[1] : 'other';
    const row = document.createElement('div');
    row.className = 'result-item';
    row.innerHTML = `
      <span>${item ? item[2] : '🍽️'} ${name} ${q > 1 ? '×' + q : ''}
        <span class="tag ${CATS[cat] ? CATS[cat].tagClass : 'tag-other'}">${CATS[cat] ? CATS[cat].tag : '?'}</span>
      </span>
      <span>${q} 份</span>`;
    list.appendChild(row);
    if (isMeatCat(cat)) meat += q;
    else if (cat === 'veg') veg += q;
  }
  $('resultMeta').innerHTML = `${state.who}点的 · ${state.people}人用餐 · 共 ${entries.length} 道 (荤${meat} 素${veg})`;
  goPage('page-result');

  // 🕘 保存点菜历史
  try {
    saveHistory({ ...state.orders }, state.people, state.who);
  } catch (e) { /* 历史保存失败不影响 */ }

  // 🔔 推送通知到 Bark
  try {
    const dishList = entries
      .map(([name, q]) => {
        const item = menu.find(m => m[0] === name);
        return `${item ? item[2] : '🍽️'} ${name}${q > 1 ? '×' + q : ''}`;

function _copyText(text, okMsg) {

    navigator.clipboard.writeText(text).then(() => toast(okMsg));
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);

    document.execCommand('copy');
    ta.remove();
    toast(okMsg);

    list.appendChild(d);
    // 加载照片预览
    getDishPhoto(name).then(photo => {
      const el = d.querySelector('.mgr-photo');
      if (el && photo) el.innerHTML = `<img src="${photo}">`;
    });
  });
}

function pickPhotoFor(name) {
  pickPhoto(async dataUrl => {
    const ok = await saveDishPhoto(name, dataUrl);
    if (ok) {
      toast(`📷 ${name} 照片已设置`, 1500);
      renderManage();
      renderDishes();
    } else {
      toast('❌ 保存失败', 2000);
    }
  });
}

function delDish(name) {
  const custom = getCustom();
  const idx = custom.findIndex(c => c[0] === name);
  if (idx >= 0) {
    custom.splice(idx, 1);
    saveCustom(custom);
    removeDishPhoto(name);
    renderManage();
    renderDishes();
    toast('🗑️ 已删除 ' + name, 1200);
  }
}

function resetAll() {
  if (!confirm('确定清空所有点菜记录？')) return;
  state.orders = {};
  state.people = 0;
  renderPeople();
  goPage('page-people');
  toast('🔄 已清空');
}

// ═════════════ 启动 ═════════════
renderPeople();
</script>
</body>
</html>
